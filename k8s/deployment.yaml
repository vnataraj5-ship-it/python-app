apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app
        image: 13.126.233.214:8082/python-app:latest

        ports:
        - containerPort: 8085

---

apiVersion: v1
kind: Service

metadata:
  name: python-service

spec:
  type: NodePort

  selector:
    app: python-app

  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
      nodePort: 30007
